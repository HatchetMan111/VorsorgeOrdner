name: ShellCheck

on:
  push:
    paths:
      - "install/**.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "install/**.sh"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./install"
          severity: warning
